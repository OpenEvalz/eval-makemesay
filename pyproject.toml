[project]
name = "openevalz-eval-makemesay"
version = "0.1.0"
description = "OpenEvalz packaging of MakeMeSay"
license = { text = "BUSL-1.1" }
requires-python = ">=3.10"
dependencies = [
  "inspect-ai==0.3.260",
  "trusted-router-py>=0.7.0",
  "pyyaml>=6",
]

[tool.openevalz]
eval = "makemesay"
execution_class = "plain"
cost_class = "low"
